services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
      POSTGRES_USER: ${POSTGRES_USER:-vms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./django_backend/vms_project
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_backend/vms_project:/app
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
      POSTGRES_USER: ${POSTGRES_USER:-vms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      GATEPASS_EMAIL_HOST: ${GATEPASS_EMAIL_HOST}
      GATEPASS_EMAIL_PORT: ${GATEPASS_EMAIL_PORT:-587}
      GATEPASS_EMAIL_USER: ${GATEPASS_EMAIL_USER}
      GATEPASS_EMAIL_PASSWORD: ${GATEPASS_EMAIL_PASSWORD}
      GATEPASS_EMAIL_USE_TLS: ${GATEPASS_EMAIL_USE_TLS:-True}
      GATEPASS_EMAIL_USE_SSL: ${GATEPASS_EMAIL_USE_SSL:-False}
      GATEPASS_MANAGER_EMAIL: ${GATEPASS_MANAGER_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: frontend
    build:
      context: ./times-global_frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
